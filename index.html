<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ochko 21</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1420;--panel:#172033;--cell:#212c44;--ink:#e8eefc;--dim:#8b97b3;--gem:#2fd5a0;--bomb:#ff5d6c;--accent:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.top b{font-size:22px}.bal{font-size:20px;font-weight:700;color:var(--accent)}
.mults{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;min-height:34px}
.mults span{background:var(--panel);color:var(--dim);padding:5px 10px;border-radius:8px;font-size:14px;white-space:nowrap}
.mults span.on{background:var(--accent);color:#1a1300;font-weight:700}
#msg{text-align:center;min-height:24px;margin:6px 0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:var(--panel);padding:10px;border-radius:16px}
.c{aspect-ratio:1;border:0;border-radius:12px;background:var(--cell);font-size:30px;color:var(--ink);padding:0}
.c:active{transform:scale(.94)}
.c.gem{background:var(--gem)}.c.bomb{background:var(--bomb)}.c.ghost{opacity:.45}
.box{background:var(--panel);border-radius:16px;padding:12px;margin-top:12px}
.row{display:flex;gap:8px;align-items:center}
input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--cell);color:var(--ink);font-size:20px;padding:10px 12px;border-radius:10px}
.sm{background:var(--cell);color:var(--ink);border:0;border-radius:10px;padding:11px 14px;font-size:16px}
.mn{display:flex;gap:6px;margin:10px 0}
.mn button{flex:1;background:var(--cell);color:var(--ink);border:0;border-radius:10px;padding:10px 0;font-size:16px}
.mn button.on{background:#6c5ce7}
.go{width:100%;border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:700;background:var(--gem);color:#06251c}
.go.cash{background:var(--accent);color:#1a1300}.go:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--panel);color:var(--dim);border:0;border-radius:10px;padding:10px;font-size:16px;font-weight:600}
.tabs button.on{background:#6c5ce7;color:#fff}
.hand{display:flex;gap:6px;flex-wrap:wrap;min-height:84px;margin-top:8px}
.card{width:56px;height:80px;background:#f4f6fb;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.card.red{color:#d92d3f}
.card.back{background:repeating-linear-gradient(45deg,#3b4a73,#3b4a73 6px,#2c3858 6px,#2c3858 12px)}
.lbl{display:flex;justify-content:space-between;color:var(--dim)}.lbl b{color:var(--ink);font-size:20px}
.two{display:flex;gap:8px}.two .go{flex:1}
</style></head><body>
<div class="top"><b>Ochko 21</b><span class="bal" id="bal">0</span></div>
<div id="bmsg" style="text-align:center;min-height:24px;margin:6px 0;font-weight:600"></div>
<div class="box"><div class="lbl"><span>Diler</span><b id="dv"></b></div><div class="hand" id="dh"></div></div>
<div class="box"><div class="lbl"><span>Siz</span><b id="pv"></b></div><div class="hand" id="ph"></div></div>
<div class="box">
  <div id="bidle">
    <div class="row"><input id="bbet" type="number" inputmode="decimal" value="10" min="1">
    <button class="sm" onclick="bbet.value=Math.max(1,Math.floor(bbet.value/2))">½</button>
    <button class="sm" onclick="bbet.value=Math.floor(bbet.value*2)">×2</button></div>
    <button class="go" style="margin-top:10px" onclick="bstart()">Boshlash</button>
  </div>
  <div id="bact" class="two" hidden>
    <button class="go" onclick="bhit()">Yana</button>
    <button class="go cash" onclick="bstand()">Yetarli</button>
  </div>
</div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=id=>document.getElementById(id);
let b={};
async function api(p,body){
  const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg.initData},body:JSON.stringify(body||{})});
  const j=await r.json();
  if(!r.ok){$('bmsg').style.color='var(--bomb)';$('bmsg').textContent=j.detail||'Xatolik';return null}
  return j;
}
function card(c,back){
  if(back)return '<div class="card back"></div>';
  return `<div class="card ${'♥♦'.includes(c[1])?'red':''}">${c[0]}${c[1]}</div>`;
}
function bdraw(){
  $('bal').textContent=(b.balance??0).toLocaleString()+' ball';
  const act=b.active;
  $('dh').innerHTML=(b.dealer||[]).map(c=>card(c)).join('')+(act?card(0,1):'');
  $('ph').innerHTML=(b.player||[]).map(c=>card(c)).join('');
  $('dv').textContent=act?'?':(b.dv??'');
  $('pv').textContent=b.pv??'';
  $('bidle').hidden=act;$('bact').hidden=!act;
}
function bapply(j){
  b=j;const m={blackjack:'Blackjack! ',win:'Yutdingiz ',push:'Durang ',lose:'Yutqazdingiz '};
  if(j.result){
    const net=+(j.payout-j.bet).toFixed(2);
    $('bmsg').textContent=m[j.result]+(net>0?'+'+net:net<0?net:'');
    $('bmsg').style.color=net>0?'var(--gem)':net<0?'var(--bomb)':'var(--dim)';
    tg.HapticFeedback?.notificationOccurred(net>0?'success':net<0?'error':'warning');
  }else $('bmsg').textContent='';
  bdraw();
}
async function bload(){const j=await api('bj/state');if(j){b=j;bdraw()}}
async function bstart(){const j=await api('bj/start',{bet:+$('bbet').value});if(j)bapply(j)}
async function bhit(){const j=await api('bj/hit');if(j)bapply(j)}
async function bstand(){const j=await api('bj/stand');if(j)bapply(j)}
bload();
</script></body></html>
